<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&family=Inter:wght@600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:radial-gradient(circle at 12% 10%,#1a4770 0%,#0f2d4e 45%,#081729 100%);
    font-family:'Inter',sans-serif;position:relative;overflow:hidden}

  /* Left: text column, big and bold, kept inside the mobile-crop-safe zone */
  .textcol{position:absolute;left:150px;top:0;width:480px;height:630px;display:flex;flex-direction:column;justify-content:center}
  .badge{display:inline-flex;align-items:center;gap:14px;margin-bottom:28px}
  .badge .sq{width:60px;height:60px;border-radius:15px;background:#fff;color:#0f2d4e;font-family:'Poppins',sans-serif;font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center;flex:none}
  .badge span{color:#dcebf7;font-size:21px;font-weight:700;letter-spacing:.02em;line-height:1.25}
  h1{font-family:'Poppins',sans-serif;font-weight:900;font-size:80px;color:#fff;line-height:.98;margin-bottom:22px;letter-spacing:-.01em}
  h1 em{color:#f0cd7e;font-style:normal;display:block}
  p.sub{font-size:27px;color:#dcebf7;font-weight:700;margin-bottom:30px}
  .pills{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
  .pill{background:rgba(255,255,255,.14);border:2.5px solid rgba(240,205,126,.7);color:#fff;
    font-weight:700;font-size:25px;padding:11px 26px;border-radius:100px;display:flex;align-items:center;gap:10px}

  /* Right: big zoomed photo panel, filling most of the canvas height */
  .photocard{
    position:absolute;left:648px;top:22px;width:480px;height:586px;
    background:#fff;border-radius:26px;padding:12px;box-shadow:0 34px 80px -18px rgba(0,0,0,.6);
  }
  .photocard img{width:100%;height:100%;object-fit:cover;object-position:center 22%;border-radius:17px;display:block}
  .ratebadge{
    position:absolute;left:598px;top:472px;background:#fff;border-radius:16px;
    padding:15px 22px;box-shadow:0 16px 34px -10px rgba(0,0,0,.45);
    display:flex;align-items:center;gap:12px;
  }
  .ratebadge .stars{color:#c99a3c;font-size:20px;letter-spacing:1px}
  .ratebadge strong{font-family:'Poppins',sans-serif;color:#0f2d4e;font-size:20px}
  .ratebadge span{color:#6a7c8c;font-size:14px;display:block}

  .corner{position:absolute;bottom:18px;right:34px;color:#5c81a3;font-size:18px;font-weight:700}
</style></head>
<body>
  <div class="textcol">
    <div class="badge"><div class="sq">S</div><span>SMILE IMPLANT &amp;<br>DENTAL CLINIC</span></div>
    <h1>Painless<br>Dental<br><em>Implants</em></h1>
    <p class="sub">Dr. Shilpa Yadav &middot; Aya Nagar, Delhi</p>
    <div class="pills">
      <div class="pill">&#11088; 4.9 Rating</div>
      <div class="pill">467+ Reviews</div>
    </div>
  </div>

  <div class="photocard">
    <img src="og-dr-photo-source.jpg" alt="Dr. Shilpa Yadav">
  </div>
  <div class="ratebadge">
    <span class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</span>
    <div><strong>4.9</strong><span>467+ reviews</span></div>
  </div>

  <div class="corner">drshilpayadav.zeradental.in</div>
</body></html>
